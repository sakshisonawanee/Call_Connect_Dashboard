<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin setup · Call Connect Dashboard</title>
<style>
:root { color-scheme: light dark; --fg:#1f2430; --muted:#6b7280; --bg:#f6f7fb; --panel:#fff; --line:#dde1ea; --accent:#2f5bd3; --bad:#d64545; }
@media (prefers-color-scheme: dark) { :root { --fg:#e8eaf0; --muted:#a0a7b5; --bg:#14161c; --panel:#1c1f27; --line:#2e323d; --accent:#7a9cff; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:15px/1.5 "Inter","Segoe UI",system-ui,sans-serif; padding:16px; }
form { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; }
h1 { font-size:1.35rem; margin:0 0 4px; }
p.sub { margin:0 0 8px; color:var(--muted); font-size:.9rem; }
label { display:block; font-size:.85rem; margin:14px 0 4px; }
input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
button { margin-top:20px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
.err { color:var(--bad); font-size:.85rem; min-height:1.2em; margin:12px 0 0; }
</style>
</head>
<body>
<form id="f">
  <h1>Create the admin account</h1>
  <p class="sub">This page works only once, while no accounts exist. The admin can then add other users.</p>
  <label for="name">Name</label>
  <input id="name" name="name" autocomplete="name" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password (at least 8 characters)</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <button id="go">Create admin and sign in</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
fetch('/api/setup').then(r => r.json()).then(d => {
  if (!d.setupOpen) { err.textContent = 'Setup is already done.'; go.disabled = true; setTimeout(() => location.href = '/login', 1500); }
}).catch(() => {});
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name.value, email: f.email.value, password: f.password.value }) });
    const d = await r.json();
    if (r.ok) { location.href = '/admin'; return; }
    err.textContent = d.error || 'Setup failed';
  } catch { err.textContent = 'Network error, try again'; }
  go.disabled = false;
});
</script>
</body>
</html>
